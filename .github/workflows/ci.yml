name: MeterGate CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: python -m unittest scripts/test_secret_scan.py && python scripts/secret_scan.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: metergate, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d metergate"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/metergate
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - working-directory: apps/api
        run: uv sync --frozen --dev
      - working-directory: apps/api
        run: uv run ruff check . && uv run ruff format --check .
      - working-directory: apps/api
        run: uv run alembic upgrade head && uv run pytest -q && uv run alembic check
      - working-directory: apps/orbitintel
        run: uv sync --frozen --all-groups && uv run ruff check . && uv run ruff format --check . && uv run pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - working-directory: apps/web
        run: npm ci && npm run lint && npm test && npm run build
      - working-directory: packages/mcp
        run: npm ci && npm run lint && npm test && npm run build
