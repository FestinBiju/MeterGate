[project]
name = "metergate-api"
version = "0.1.0"
description = "MeterGate core API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi[standard]>=0.115,<1",
    "jsonschema>=4.26,<5",
    "pydantic-settings>=2.7,<3",
    "razorpay==2.0.1",
    "redis>=5,<8",
    "requests>=2.32,<3",
    "rfc8785>=0.1.4,<0.2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "webauthn>=3,<4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]
