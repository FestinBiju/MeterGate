[project]
name = "orbitintel"
version = "0.1.0"
description = "Private OrbitIntel reference merchant for MeterGate"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "httpx2>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5,<8",
    "rfc8785>=0.1.4,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that call the live CelesTrak service",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]
